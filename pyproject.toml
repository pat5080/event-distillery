[project]
name = "event-distillery"
version = "0.1.0"
description = "Distills hundreds of weekly event listings down to the handful worth knowing about."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.68",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
distillery = "distillery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/distillery"]